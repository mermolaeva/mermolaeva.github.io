# Theme
remote_theme            : "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin   : "default"

# Site settings
locale                   : "en"
title                    : "Marina Ermolaeva"
title_separator          : "-"
name                     : "Marina Ermolaeva"
description              : ""
url                      : "https://mermolaeva.com"
baseurl                  : ""
repository               : "mermolaeva/mermolaeva.github.io"
words_per_minute         : 200

atom_feed:
  hide                   : true

# Google Analytics 4. The legacy Universal Analytics tag on the deployed site
# was connected to this GA4 stream; use the current tag directly.
analytics:
  provider               : "google-gtag"
  google:
    tracking_id          : "G-0WFMPEXFH1"

# Site author
author:
  name                   :
  avatar                 : "/assets/images/photo.jpg"
  bio                    : "<i class='fas fa-graduation-cap fa-fw' aria-hidden='true'></i> Ph.D. in linguistics"
  location               : "Edinburgh, UK"
  email                  : "mail@mermolaeva.com"

# Site footer
footer:
  since                  : "2017"

# Reading files
include:
  - .htaccess
  - _pages
exclude:
  - AGENTS.md
  - agent-log.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - jekyll_cheat_sheet.md
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG.md
  - docs
  - test
  - node_modules
  - package.json
  - Rakefile
  - banner.js
  - minimal-mistakes-jekyll.gemspec
  - tmp
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Output
permalink: /:categories/:title/
timezone:

# Plugins
plugins:
  - jekyll-include-cache

# GitHub Pages safe-mode allowlist
whitelist:
  - jekyll-include-cache

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments:
      share: true
      related: true
